<rect width="980" height="34" rx="10" fill="#161b22"/><rect y="24" width="980" height="10" fill="#161b22"/>
<circle cx="20" cy="17" r="6" fill="#ff5f56"/><circle cx="40" cy="17" r="6" fill="#ffbd2e"/><circle cx="60" cy="17" r="6" fill="#27c93f"/>
<text x="490" y="22" fill="#8b949e" text-anchor="middle" style="opacity:1;animation:none;font-size:12px">cgw — demo with sample IDs (DRY=1: nothing is changed)</text>
<text id="a0" class="l" x="26" y="52" fill="#e6edf3"><tspan fill="#7ee787">$</tspan> cgw version</text><text id="a1" class="l" x="26" y="72" fill="#c9d1d9">cgw 0.2.0 (tested with codex-chatgpt-web 6.1.5)</text><text id="a2" class="l" x="26" y="92" fill="#c9d1d9"></text><text id="a3" class="l" x="26" y="112" fill="#e6edf3"><tspan fill="#7ee787">$</tspan> cgw adopt personal</text><text id="a4" class="l" x="26" y="132" fill="#c9d1d9">adopted &#x27;personal&#x27; (tunnel_0123456789abcdef0123456789abcdef) as the current account</text><text id="a5" class="l" x="26" y="152" fill="#c9d1d9"></text><text id="a6" class="l" x="26" y="172" fill="#e6edf3"><tspan fill="#7ee787">$</tspan> cgw clip tunnel work</text><text id="a7" class="l" x="26" y="192" fill="#c9d1d9">added &#x27;work&#x27; tunnel: tunnel_fedcba9876543210fedcba9876543210</text><text id="a8" class="l" x="26" y="212" fill="#c9d1d9"></text><text id="a9" class="l" x="26" y="232" fill="#e6edf3"><tspan fill="#7ee787">$</tspan> cgw list</text><text id="a10" class="l" x="26" y="252" fill="#7ee787">* personal         tunnel_0123456789abcdef0123456789abcdef  login:active</text><text id="a11" class="l" x="26" y="272" fill="#c9d1d9">  work             tunnel_fedcba9876543210fedcba9876543210  login:none</text><text id="a12" class="l" x="26" y="292" fill="#c9d1d9"></text><text id="a13" class="l" x="26" y="312" fill="#e6edf3"><tspan fill="#7ee787">$</tspan> DRY=1 cgw use work</text><text id="a14" class="l" x="26" y="332" fill="#79c0ff">==&gt; quitting launcher</text><text id="a15" class="l" x="26" y="352" fill="#79c0ff">==&gt; no saved login for &#x27;work&#x27; — a ChatGPT sign-in will be requested</text><text id="a16" class="l" x="26" y="372" fill="#79c0ff">==&gt; starting launcher</text><text id="a17" class="l" x="26" y="392" fill="#8b949e">[dry-run] open -a Codex Web GPT</text><text id="a18" class="l" x="26" y="412" fill="#8b949e">[dry-run] kill listener on :17841</text><text id="a19" class="l" x="26" y="432" fill="#79c0ff">==&gt; configuring tunnel for &#x27;work&#x27;</text><text id="a20" class="l" x="26" y="452" fill="#8b949e">[dry-run] cgw setup --full --login  --refresh-account-capabilities --tunnel-id</text><text id="a21" class="l" x="26" y="472" fill="#8b949e">    tunnel_fedcba9876543210fedcba9876543210 --runtime-key-file ~/.codex-chatgpt-web/accounts/work/runtime.key</text><text id="a22" class="l" x="26" y="492" fill="#79c0ff">==&gt; restarting launcher so the tunnel profile is regenerated</text><text id="a23" class="l" x="26" y="512" fill="#8b949e">[dry-run] open -a Codex Web GPT</text><text id="a24" class="l" x="26" y="532" fill="#79c0ff">==&gt; doctor</text><text id="a25" class="l" x="26" y="552" fill="#c9d1d9"></text><text id="a26" class="l" x="26" y="572" fill="#c9d1d9">Done: active account = work</text><text id="a27" class="l" x="26" y="592" fill="#c9d1d9">Manual steps ChatGPT does not allow automating (once per account):</text><text id="a28" class="l" x="26" y="612" fill="#c9d1d9">  1. https://chatgpt.com/#settings/Plugins -&gt; attach this tunnel to connector &quot;Codex Native2&quot;</text><text id="a29" class="l" x="26" y="632" fill="#c9d1d9">  2. Restart the Codex app if the model list looks stale</text>
</svg>